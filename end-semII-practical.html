<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>

<body style="
    margin:0; 
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#000000,#0e1a53);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
">

<div style="
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
    width:350px;
">

    <h2 style="color:#333;">
        🎓 Student Grade Calculator
    </h2>

    <p style="color:#666;">
        Click the button and enter marks for 5 subjects.
    </p>

    <button onclick="calculate()" id="btn"
        style="
        padding:12px 30px;
        border:none;
        border-radius:30px;
        background:linear-gradient(45deg,#667eea,#371e51);
        color:white;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:all 0.3s ease;
        ">
        Calculate Result
    </button>

    <h3 id="result" style="
        margin-top:20px;
        color:#444;
        line-height:1.8;
    "></h3>

</div>

<script>

const btn = document.getElementById("btn");

btn.addEventListener("mouseover", function() {
    btn.style.transform = "scale(1.08)";
    btn.style.boxShadow = "0 8px 20px rgba(102,126,234,0.5)";
});

btn.addEventListener("mouseout", function() {
    btn.style.transform = "scale(1)";
    btn.style.boxShadow = "none";
});

function calculate() {

    let total = 0;
    let pass = true;

    // Marks entered using loop
    for(let i = 1; i <= 5; i++) {

        let marks = Number(prompt("Enter marks for Subject " + i));

        total += marks;

        if(marks < 40) {
            pass = false;
        }
    }

    let average = total / 5;
    let grade;

    if (average >= 90)
        grade = "A+";
    else if (average >= 75)
        grade = "A";
    else if (average >= 60)
        grade = "B";
    else if (average >= 40)
        grade = "C";
    else
        grade = "F";

    let status = pass ? "PASS" : "FAIL";

    document.getElementById("result").innerHTML =
        "<b>Total Marks:</b> " + total +
        "<br><b>Average:</b> " + average.toFixed(2) +
        "<br><b>Grade:</b> " + grade +
        "<br><b>Result:</b> " + status;
}

</script>

</body>
</html>
